# services: Define cada contêiner (microsserviço, banco, storage).
# build: Indica a pasta onde está o Dockerfile para construir a imagem da API.
# image: Usa imagens prontas do Docker Hub (para Postgres e MinIO).
# ports: Mapeia portas do seu computador para portas dentro do contêiner.
# volumes: postgres_data e minio_data garantem que os dados não se percam.
# environment: Define variáveis de ambiente.
# depends_on: Garante a ordem de inicialização.

version: '3.8'

services:
  api-politicas:
    build: ./api-politicas
    ports:
      - "5001:5000"
    volumes:
      - ./api-politicas:/app
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - MINIO_URL=http://storage:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-super-secret-admin-token-123}

  api-consentimentos:
    build: ./api-consentimentos
    ports:
      - "5002:5000"
    volumes:
      - ./api-consentimentos:/app
    depends_on:
      database:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-chave-super-secreta-para-a-poc}
      - DATABASE_URL=postgresql://user:password@database:5432/consentdb
      - ADMIN_TOKEN=${ADMIN_TOKEN:-super-secret-admin-token-123}

  # Worker de Privacidade — Processa a Limpeza de Dados (KMS Lógico).
  api-worker:
    build: ./api-consentimentos
    command: python worker.py
    volumes:
      - ./api-consentimentos:/app
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@database:5432/consentdb

  # Painel de Administração - Gestão de Políticas e Auditoria
  admin-panel:
    build: ./admin-panel
    ports:
      - "5003:5000"
    volumes:
      - ./admin-panel:/app
    depends_on:
      - api-politicas
      - api-consentimentos
    environment:
      URL_API_POLITICAS: http://api-politicas:5000
      URL_API_CONSENTIMENTOS: http://api-consentimentos:5000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-super-secret-admin-token-123}

  smart-chatbot:
    build: ./smart-chatbot
    ports:
      - "5004:5000"
    volumes:
      - ./smart-chatbot:/app
    depends_on:
      - api-politicas
      - api-consentimentos
    environment:
      URL_API_POLITICAS: http://api-politicas:5000
      URL_API_CONSENTIMENTOS: http://api-consentimentos:5000

  # Container para simular o Provedor de Identidade (IdP)
  mock-idp:
    build: ./mock-idp
    ports:
      - "5005:5000"
    volumes:
      - ./mock-idp:/app
    environment:
      - JWT_SECRET=${JWT_SECRET:-chave-super-secreta-para-a-poc}

  database:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  storage:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
