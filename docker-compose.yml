# services: Define cada contêiner (microsserviço, banco, storage).
# build: Indica a pasta onde está o Dockerfile para construir a imagem da API (vamos criar os Dockerfiles depois).
# image: Usa imagens prontas do Docker Hub (para Postgres e MinIO).
# ports: Mapeia portas do seu computador para portas dentro do contêiner.
# volumes: postgres_data e minio_data garantem que os dados não se percam quando os contêineres pararem. Os volumes mapeados nas APIs (./api-politicas:/app) permitem que alterações no seu código local sejam refletidas imediatamente no contêiner, sem precisar reconstruir a imagem.
# environment: Define variáveis de ambiente, como as credenciais do banco e do MinIO, que suas APIs usarão para se conectar.
# depends_on: Garante que o banco de dados e o storage iniciem antes das APIs que dependem deles.
# command: O comando executado quando o contêiner inicia.

version: '3.8'

services:
  api-politicas:
    build: ./api-politicas
    ports:
      - "5001:5000"
    volumes:
      - ./api-politicas:/app
    depends_on:
      database:
        condition: service_healthy # Espera o banco estar 100% pronto
      storage:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - MINIO_URL=http://storage:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-super-secret-admin-token-123}

  api-consentimentos:
    build: ./api-consentimentos
    ports:
      - "5002:5000"
    volumes:
      - ./api-consentimentos:/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:-chave-super-secreta-para-a-poc}
      - DATABASE_URL=postgresql://user:password@database:5432/consentdb
      - ADMIN_TOKEN=${ADMIN_TOKEN:-super-secret-admin-token-123}
      - REDIS_URL=redis://redis:6379

  # Painel de Administração - Gestão de Políticas e Auditoria
  admin-panel:
    build: ./admin-panel
    ports:
      - "5003:5000"
    volumes:
      - ./admin-panel:/app
    depends_on:
      - api-politicas
      - api-consentimentos
    environment:
      URL_API_POLITICAS: http://api-politicas:5000
      URL_API_CONSENTIMENTOS: http://api-consentimentos:5000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-super-secret-admin-token-123}

  smart-chatbot:
    build: ./smart-chatbot
    ports:
      - "5004:5000"
    volumes:
      - ./smart-chatbot:/app
    depends_on:
      - api-politicas
      - api-consentimentos
    environment:
      URL_API_POLITICAS: http://api-politicas:5000
      URL_API_CONSENTIMENTOS: http://api-consentimentos:5000

  # Container para simular o Provedor de Identidade (IdP)
  mock-idp:
    build: ./mock-idp
    ports:
      - "5005:5000" # Expondo na porta 5005 do seu ambiente local
    volumes:
      - ./mock-idp:/app
    environment:
      - JWT_SECRET=${JWT_SECRET:-chave-super-secreta-para-a-poc}
  database:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  storage:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ---------------------------------------------------------------------------
  # Auditoria — Redis Stream + Vault (File Storage) + Audit Engine
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Vault com File Storage persistente.
  # Chaves Transit sobrevivem a restarts via volume vault_data.
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK                        # Previne swap de memória (segurança)
    ports:
      - "8200:8200"                     # Exposto para acesso administrativo local
    volumes:
      - vault_data:/vault/data          # Persistência das chaves Transit
      - ./audit-engine/vault-config:/vault/config
    command: vault server -config=/vault/config/vault.hcl
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    healthcheck:
      test: ["CMD-SHELL", "vault status 2>&1 | grep -q 'Seal Type'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Container one-shot: inicializa o Vault na 1ª execução e unsela em todo restart.
  # Habilita o Transit Engine após o unseal.
  # Encerra com código 0 quando tudo está pronto.
  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - vault_data:/vault/data          # Lê/escreve init.json com unseal keys
      - ./audit-engine/vault-init.sh:/vault-init.sh
    environment:
      - VAULT_ADDR=http://vault:8200
    command: sh /vault-init.sh
    restart: on-failure

  # Worker de auditoria — só sobe após banco + Redis + Vault estarem prontos.
  audit-engine:
    build: ./audit-engine
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault_data:/vault/data:ro       # Leitura do root token em init.json
    environment:
      - DATABASE_URL=postgresql://user:password@database:5432/consentdb
      - REDIS_URL=redis://redis:6379
      - VAULT_ADDR=http://vault:8200
      - VAULT_INIT_FILE=/vault/data/init.json


volumes:
  postgres_data:
  minio_data:
  vault_data:                           # Chaves Transit do Vault (persistentes)
